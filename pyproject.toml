[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetica-ray"
version = "0.1.0"
description = "Ray integration for Kinetica"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = "Apache-2.0"
authors = [{ name = "Kinetica", email = "support@kinetica.com" }]
keywords = ["ray", "kinetica", "distributed", "database", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "ray[data]>=2.9.0",
    "gpudb",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/kineticadb/ray"
Repository = "https://github.com/kineticadb/ray"

[tool.setuptools.packages.find]
where = ["."]
include = ["kinetica_ray*"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["kinetica_ray", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP045"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["kinetica_ray"]
omit = ["*/tests/*", "*/__init__.py"]
